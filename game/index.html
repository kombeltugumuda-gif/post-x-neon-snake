<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Snake — one prompt, one file</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050510;
    color: #e8fff2;
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    overflow: hidden;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    color: #39ff88;
    text-shadow: 0 0 12px #39ff88, 0 0 32px #39ff88;
  }
  #hud {
    display: flex;
    gap: 28px;
    font-size: 18px;
    font-weight: 600;
  }
  #hud span { color: #39ff88; }
  #hud .best { color: #ff5da2; }
  #wrap {
    position: relative;
    border: 2px solid #1d3a2a;
    border-radius: 12px;
    box-shadow: 0 0 24px rgba(57, 255, 136, 0.25), inset 0 0 40px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  canvas { display: block; background: #070714; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(5, 5, 16, 0.78);
    text-align: center;
    padding: 16px;
  }
  #overlay h2 { font-size: 26px; color: #39ff88; text-shadow: 0 0 14px #39ff88; }
  #overlay p { font-size: 15px; color: #b8ffd6; line-height: 1.5; }
  #overlay button {
    margin-top: 6px;
    font-size: 17px;
    font-weight: 700;
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    background: #39ff88;
    color: #04140a;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(57, 255, 136, 0.6);
  }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 6px;
    margin-top: 4px;
  }
  #pad button {
    font-size: 22px;
    border: 1px solid #1d3a2a;
    border-radius: 10px;
    background: #0d1f16;
    color: #39ff88;
    cursor: pointer;
  }
  #pad button:active { background: #1d3a2a; }
  #pad .up { grid-column: 2; grid-row: 1; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  #foot { font-size: 12px; color: #5c7a68; }
</style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div id="hud">
    <div>SCORE <span id="score">0</span></div>
    <div class="best">BEST <span id="best">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <h2 id="ov-title">NEON SNAKE</h2>
      <p id="ov-text">Eat the pink dots. Don't hit the walls<br>or your own tail. Arrow keys or the pad below.</p>
      <button id="ov-btn">PLAY</button>
    </div>
  </div>
  <div id="pad">
    <button class="up" data-dir="up">&#9650;</button>
    <button class="left" data-dir="left">&#9664;</button>
    <button class="down" data-dir="down">&#9660;</button>
    <button class="right" data-dir="right">&#9654;</button>
  </div>
  <div id="foot">one prompt &middot; one file &middot; no libraries</div>

<script>
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovText = document.getElementById('ov-text');
  var ovBtn = document.getElementById('ov-btn');

  var CELL = 20, COLS = 24, ROWS = 24;
  var snake, dir, nextDir, food, score, best = 0, stepMs, lastTime, running, dead;

  // tiny read-only handle so an automated demo can steer the snake
  window.__snake = {
    get snake() { return snake; },
    get food() { return food; },
    get dir() { return dir; },
    get running() { return running; }
  };

  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    stepMs = 140;
    lastTime = 0;
    running = true;
    dead = false;
    scoreEl.textContent = '0';
    overlay.style.display = 'none';
    placeFood();
  }

  function placeFood() {
    while (true) {
      var f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      var clash = snake.some(function (s) { return s.x === f.x && s.y === f.y; });
      if (!clash) { food = f; return; }
    }
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // no reversing into yourself
    if (dir.x === x && dir.y === y) return;
    nextDir = { x: x, y: y };
  }

  var KEYS = {
    ArrowUp: [-0, -1], KeyW: [0, -1],
    ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0]
  };
  document.addEventListener('keydown', function (e) {
    if (KEYS[e.code]) { e.preventDefault(); setDir(KEYS[e.code][0], KEYS[e.code][1]); if (!running && !dead) reset(); }
    if ((e.code === 'Enter' || e.code === 'Space') && !running) reset();
  });
  document.querySelectorAll('#pad button').forEach(function (b) {
    b.addEventListener('click', function () {
      var d = b.getAttribute('data-dir');
      if (d === 'up') setDir(0, -1);
      if (d === 'down') setDir(0, 1);
      if (d === 'left') setDir(-1, 0);
      if (d === 'right') setDir(1, 0);
      if (!running && !dead) reset();
    });
  });
  ovBtn.addEventListener('click', reset);

  function step() {
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      if (score > best) { best = score; bestEl.textContent = String(best); }
      stepMs = Math.max(70, stepMs - 4); // faster every bite
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    running = false;
    dead = true;
    ovTitle.textContent = 'GAME OVER';
    ovText.innerHTML = 'Score: <b>' + score + '</b> &middot; Best: <b>' + best + '</b><br>Press Enter or tap PLAY to go again.';
    ovBtn.textContent = 'PLAY AGAIN';
    overlay.style.display = 'flex';
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(57,255,136,0.07)';
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }
    // food
    ctx.save();
    ctx.shadowColor = '#ff5da2';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff5da2';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // snake
    snake.forEach(function (s, idx) {
      var t = 1 - idx / snake.length;
      ctx.save();
      ctx.shadowColor = '#39ff88';
      ctx.shadowBlur = 14;
      ctx.fillStyle = idx === 0 ? '#a9ffcb' : 'rgba(57,255,136,' + (0.45 + 0.55 * t).toFixed(2) + ')';
      var pad = idx === 0 ? 2 : 3;
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 6);
      ctx.fill();
      ctx.restore();
    });
  }

  function loop(t) {
    if (running) {
      if (t - lastTime >= stepMs) { lastTime = t; step(); }
      draw();
    }
    requestAnimationFrame(loop);
  }

  // idle board behind the start overlay (drawn before the first PLAY)
  snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
  dir = { x: 1, y: 0 };
  nextDir = dir;
  score = 0;
  stepMs = 140;
  running = false;
  dead = false;
  placeFood();

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
